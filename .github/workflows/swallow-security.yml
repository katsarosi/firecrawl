name: swallow-security

on:
  workflow_dispatch:
  pull_request:
    branches: ["secure/**"]
  push:
    branches: ["secure/**"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/playwright-service-ts/pnpm-lock.yaml
      - name: Install API dependencies and build native module
        working-directory: apps/api
        run: pnpm install --frozen-lockfile
      - name: Install Playwright service dependencies
        working-directory: apps/playwright-service-ts
        run: pnpm install --frozen-lockfile
      - name: Swallow security guard and regression suite
        run: scripts/swallow-security-check.sh
      - name: API type check
        working-directory: apps/api
        run: pnpm exec tsc --noEmit
      - name: Relevant deterministic upstream URL tests
        working-directory: apps/api
        run: pnpm exec vitest run src/lib/validateUrl.test.ts
