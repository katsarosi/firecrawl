name: swallow-upstream-update

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: secure/swallow-v2.11.0-r1
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/playwright-service-ts/pnpm-lock.yaml
      - name: Resolve immutable canonical release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/firecrawl/firecrawl/releases/latest --jq .tag_name)"
          git remote add canonical https://github.com/mendableai/firecrawl.git
          git fetch canonical "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-parse "${tag}^{commit}")"
          test -n "$commit"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Stop if an update PR already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          branch="swallow-upstream-${TAG#v}"
          count="$(gh pr list --head "$branch" --state open --json number --jq length)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "skip=$([[ "$count" != 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Prepare patch-stack update
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git branch "upstream-mirror/${TAG#v}" "$COMMIT"
          git switch -c "$BRANCH"
          git merge --no-edit "$COMMIT"
          test -s apps/api/src/scraper/scrapeURL/engines/utils/destinationPolicy.ts
          test -s apps/playwright-service-ts/network-security.ts
          git diff --check
      - name: Install and run complete guarded checks
        if: steps.existing.outputs.skip != 'true'
        run: |
          (cd apps/api && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm exec vitest run src/lib/validateUrl.test.ts)
          (cd apps/playwright-service-ts && pnpm install --frozen-lockfile)
          scripts/swallow-security-check.sh
      - name: Push branches and open review PR
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          git push origin "upstream-mirror/${TAG#v}"
          git push origin "$BRANCH"
          gh pr create --base secure/swallow-v2.11.0-r1 --head "$BRANCH" \
            --title "chore(security): review upstream ${TAG}" \
            --body "Automated preparation only. Canonical upstream commit: \`${COMMIT}\`. Human approval is required; this workflow cannot merge, publish, or deploy."
